name: Development Workflow

on:
  push:
    branches-ignore:
      - 'master'

permissions:
  contents: read

jobs:
  run:
    name: Run action
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
    
    - name: Setup SourcePawn Compiler
      uses: ./
      with:
        version: "1.12.x"
      
    - name: Verify compiler
      run: |
        which spcomp
        echo $includePath
        ls -l $scriptingPath
        cat $(which spcomp)
        spcomp __tests__/compile.sp
