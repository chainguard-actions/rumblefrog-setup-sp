name: Main Workflow

on:
  push:
    branches:
      - 'master'

permissions: {}

jobs:
  run:
    name: Run action
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
    
    - name: Setup SourcePawn Compiler
      uses: rumblefrog/setup-sp@99bd7a13a9abba3823345930178a635bac70fb89 # master
      with:
        version: "1.12.x"
      
    - name: Verify compiler
      run: |
        which spcomp
        echo $includePath
        ls -l $scriptingPath
        cat $(which spcomp)
        spcomp __tests__/compile.sp
