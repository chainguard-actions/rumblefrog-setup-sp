name: Test basic SP compiler setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '1.10.x'
          github-token: ${{ github.token }}
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert spcomp is on PATH
        run: |
          echo "which spcomp: $(which spcomp || echo 'not found')"
          if ! command -v spcomp &>/dev/null; then
            echo "FAIL: spcomp not found on PATH"
            exit 1
          fi
          echo "PASS: spcomp found at $(which spcomp)"
      - name: Assert spcomp runs
        run: |
          spcomp --version 2>&1 || spcomp -v 2>&1 || true
          echo "PASS: spcomp executed"
