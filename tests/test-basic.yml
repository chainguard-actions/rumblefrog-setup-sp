name: Test basic SP compiler setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Setup SourcePawn compiler
        uses: .
        with:
          version: '1.10.x'

      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"

      - name: Assert spcomp is on PATH
        run: |
          if ! command -v spcomp &>/dev/null && ! command -v spcomp64 &>/dev/null; then
            echo "FAIL: spcomp/spcomp64 not found on PATH"
            exit 1
          fi
          echo "PASS: spcomp is available on PATH"

      - name: Assert scriptingPath env var is set
        run: |
          echo "scriptingPath: $scriptingPath"
          if [ -z "$scriptingPath" ]; then
            echo "FAIL: scriptingPath env var is not set"
            exit 1
          fi
          echo "PASS: scriptingPath is '$scriptingPath'"

      - name: Assert includePath env var is set
        run: |
          echo "includePath: $includePath"
          if [ -z "$includePath" ]; then
            echo "FAIL: includePath env var is not set"
            exit 1
          fi
          echo "PASS: includePath is '$includePath'"
