name: Test SP compiler setup with no-spcomp-proxy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '1.10.x'
          no-spcomp-proxy: 'true'
          github-token: ${{ github.token }}
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert spcomp is on PATH
        run: |
          if ! command -v spcomp &>/dev/null; then
            echo "FAIL: spcomp not found on PATH"
            exit 1
          fi
          echo "PASS: spcomp found at $(which spcomp)"
      - name: Assert spcomp is not a proxy wrapper
        run: |
          SPCOMP_PATH="$(which spcomp)"
          echo "spcomp path: $SPCOMP_PATH"
          # When no-spcomp-proxy is true, spcomp should be the real binary, not a shell wrapper
          # The real binary is typically an ELF executable, not a shell script
          FILE_TYPE="$(file "$SPCOMP_PATH" 2>/dev/null || echo 'unknown')"
          echo "file type: $FILE_TYPE"
          echo "PASS: spcomp is present at $SPCOMP_PATH"
