name: Test no-spcomp-proxy option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '1.10.x'
          no-spcomp-proxy: 'true'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert spcomp is available without proxy
        run: |
          echo "Checking for spcomp in PATH (no proxy mode)..."
          if ! command -v spcomp &>/dev/null; then
            echo "FAIL: spcomp not found in PATH"
            exit 1
          fi
          echo "PASS: spcomp found at $(command -v spcomp)"
